<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">

<style>
*{box-sizing:border-box;margin:0;padding:0;}

html,body{
  width:1920px;
  height:1080px;
  overflow:hidden;
  background:#0a0a0a;
  color:#fff;
  font-family:Arial,sans-serif;
}

.header{
  height:110px;
  background:#111;
  border-bottom:4px solid #7a3030;
  padding:30px 80px 10px 165px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:38px;
  font-weight:900;
  letter-spacing:3px;
  white-space:nowrap;
}

.logo-sub{
  font-size:18px;
  color:#777;
  font-weight:400;
  letter-spacing:1px;
}

.header-right{
  text-align:right;
  color:#aaa;
  font-size:18px;
  line-height:1.5;
  min-width:360px;
  padding-left:30px;
}

.live-dot{color:#5cb85c;}

.ticker{
  height:48px;
  background:#7a3030;
  color:#f5dddd;
  font-size:20px;
  font-weight:700;
  overflow:hidden;
  white-space:nowrap;
  display:flex;
  align-items:center;
}

.ticker-inner{
  display:inline-block;
  padding-left:100%;
  animation:scroll 45s linear infinite;
  -webkit-animation:scroll 45s linear infinite;
  will-change:transform;
}

@keyframes scroll{
  0%{transform:translateX(0);}
  100%{transform:translateX(-100%);}
}

@-webkit-keyframes scroll{
  0%{-webkit-transform:translateX(0);}
  100%{-webkit-transform:translateX(-100%);}
}

.section-header{
  height:65px;
  padding:0 80px 0 165px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#151515;
  border-bottom:2px solid #7a3030;
}

.section-title{
  font-size:25px;
  font-weight:800;
  letter-spacing:2px;
}

.updated{
  font-size:15px;
  color:#777;
}

.column-header,
.game-row{
  display:grid;

  /* Matchup and score get most of the screen */
  grid-template-columns:
    500px
    190px
    140px
    140px
    140px
    180px;

  column-gap:14px;
  align-items:center;
}

.column-header{
  height:50px;
  padding:0 190px;
  background:#111;
  color:#666;
  font-size:14px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:1px;
}

.column-header{
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:24px;
}

.column-set{
  display:grid;
  grid-template-columns:225px 180px 100px 100px 1fr;
  align-items:center;
}

.column-set > div:first-child{
  text-align:left;
  padding-left:24px;
}

.column-set > div:not(:first-child){
  text-align:center;
}

.column-set > div:nth-child(2){
  text-align:left;
}

#localTeams{
  height:0;
  overflow:hidden;
  background:#0d0d0d;
  color:#fff;
  border-bottom:4px solid #123b70;
  transition:height .2s ease;
}

#localTeams.has-games{
  height:190px;
  padding:24px 0;
}

.local-heading{
  max-width:1540px;
  margin:0 auto 10px;
  font-size:16px;
  font-weight:900;
  letter-spacing:2px;
}

.local-grid{
  max-width:1540px;
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:28px;
}

.local-card{
  min-height:120px;
  padding:10px 22px;
  border-left:5px solid #123b70;
  background:#151515;
  display:grid;
  grid-template-columns:208px 180px 1fr;
  grid-template-rows:repeat(3,auto);
  gap:4px 22px;
  align-items:center;
}

.local-teams{
  grid-column:1;
  grid-row:1 / 4;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:9px;
}

.local-team-line{
  display:flex;
  justify-content:space-between;
  gap:16px;
  font-size:21px;
  font-weight:800;
  white-space:nowrap;
}

.local-team-line.away{
  color:#bbb;
  font-weight:500;
}

.local-team-score{
  color:#fff;
  font-size:24px;
  font-weight:900;
  min-width:28px;
  text-align:right;
  transform:translateX(30px);
}

.local-middle{
  grid-column:2;
  grid-row:1 / 4;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:8px;
  padding-left:0;
  text-align:center;
  transform:translateX(70px);
  color:#fff;
  font-size:15px;
  font-weight:800;
  text-transform:uppercase;
}

.local-right{
  grid-column:2;
  grid-column:3;
  grid-row:1 / 4;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:7px;
  text-align:right;
  color:#bbb;
  font-size:14px;
  font-weight:700;
}

.local-stats{
  color:#9fc5f7;
  font-size:15px;
}

.column-header div:not(:first-child){
  text-align:center;
}

.column-header .column-set > div:nth-child(2){
  text-align:left;
}

#games{
  height:708px;
  overflow:hidden;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(6,minmax(0,1fr));
  gap:3px 24px;
  padding:0 190px;
}

#games.with-local{
  height:518px;
  grid-template-rows:repeat(4,minmax(0,1fr));
}

.game-row{
  height:118px;
  padding:11px 80px 11px 165px;
  border-bottom:1px solid #242424;
}

.game-row{
  height:auto;
  min-height:0;
  padding:10px 24px;
  grid-template-columns:201px 180px 100px 100px 1fr;
  grid-template-rows:1fr;
  column-gap:14px;
}

.game-row > .two-lines{
  grid-row:1;
  grid-column:1;
}

.game-row > .score-block{
  grid-row:1;
  grid-column:2;
  text-align:left;
}

.game-row > .odds:nth-child(3){
  grid-row:1;
  grid-column:3;
}

.game-row > .odds:nth-child(4){
  grid-row:1;
  grid-column:4;
}

.game-row > .odds:nth-child(5){
  grid-row:1;
  grid-column:5;
}

.game-row > .game-info{
  display:none;
}

.game-row .total{
  min-width:0;
  width:100%;
  padding:6px 4px;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.game-row:nth-child(odd){
  background:#0d0d0d;
}

.game-row:nth-child(even){
  background:#151515;
}

.game-row.featured{
  border-left:6px solid #a04040;
  padding-left:159px;
  background:#181313;
}

.two-lines{
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:9px;
}

.team-line{
  height:27px;
  display:flex;
  align-items:center;
  font-size:21px;
  font-weight:800;
  white-space:nowrap;
}

.team-line.away{
  color:#bbb;
  font-weight:500;
}

.feature-tag{
  display:inline-block;
  margin-left:10px;
  padding:2px 7px;
  background:#7a3030;
  color:#f0d0d0;
  font-size:11px;
}

.score-block{
  text-align:center;
}

.score-lines{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.score{
  font-size:28px;
  line-height:32px;
  font-weight:900;
  color:#fff;
}

.status{
  margin-top:3px;
  font-size:13px;
  font-weight:900;
  letter-spacing:1px;
}

.status.live{
  color:#f0c040;
}

.status.final{
  color:#5cb85c;
}

.odds .total.final{
  color:#5cb85c;
}

.status.upcoming{
  color:#666;
}

.odds{
  text-align:center;
  font-size:18px;
  font-weight:800;
  color:#f0c040;
}

.odds-lines{
  display:flex;
  flex-direction:column;
  gap:5px;
  align-items:center;
}

.odd{
  min-width:88px;
  padding:5px 7px;
  background:#1b1b1b;
  border:1px solid #303030;
  border-radius:3px;
}

.total{
  min-width:90px;
  padding:8px;
  display:inline-block;
  background:#1b1b1b;
  border:1px solid #303030;
  border-radius:3px;
}

.game-info{
  text-align:center;
}

.game-date{
  font-size:15px;
  font-weight:800;
  color:#bbb;
  margin-bottom:7px;
}

.kickoff{
  font-size:17px;
  font-weight:800;
  color:#fff;
}

.loading,
.error,
.no-games{
  height:500px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  font-size:28px;
}

.footer{
  height:99px;
  background:#0f0f0f;
  border-top:1px solid #222;
  padding:0 80px 0 165px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#555;
  font-size:14px;
}

/* MLB identity: black board with Dodgers ticker */
.header{
  background:#111;
  color:#fff;
  border-bottom-color:#123b70;
  border-bottom-width:4px;
}
.logo-sub{color:#777;}
.header-right{color:#aaa;}
.updated{color:#777;}
.ticker{
  height:56px;
  background:#fff;
  color:#2f6fbd;
  border-bottom:4px solid #123b70;
}
.section-header{
  background:#151515;
  color:#fff;
  border-bottom-color:#123b70;
  border-bottom-width:4px;
}
.column-header{
  background:#111;
  color:#666;
}
#games{
  height:700px;
}
#games.with-local{
  height:510px;
}
.game-row > .score-block{transform:translateX(70px);}
.column-header .column-set > div:nth-child(2){transform:translateX(70px);}
.column-set{column-gap:14px;}
.header{position:relative;}
.header .logo{position:absolute;left:50%;transform:translateX(-50%);}
.header .header-right{position:absolute;left:50px;right:auto;text-align:left;padding-left:0;}
.section-header{position:relative;}
.section-title{position:absolute;left:50%;transform:translateX(-50%);}
.section-header > div:last-child{position:absolute;right:80px;}
.column-header .column-set:first-child{transform:translateX(-140px);}
#games .game-row:nth-child(odd){transform:translateX(-140px);}
.column-header .column-set:nth-child(2){transform:translateX(46px);}
#games .game-row:nth-child(even){transform:translateX(46px);}
#games .game-row:nth-child(odd),
#games .game-row:nth-child(even){width:calc(100% + 164px);}
#games .game-row:nth-child(even){transform:translateX(0);}
#games .game-row:nth-child(odd){box-shadow:24px 0 0 #0d0d0d;}
#games .game-row:nth-child(even){box-shadow:-24px 0 0 #0d0d0d, 32px 0 0 #0d0d0d;}
#games .game-row:nth-child(even) > .two-lines,
#games .game-row:nth-child(even) > .odds,
#games .game-row:nth-child(even) > .game-info{transform:translateX(46px);}
#games .game-row:nth-child(even) > .score-block{transform:translateX(116px);}
.game-row:nth-child(even){background:#0d0d0d;}
.game-row .total{background:#141414;}
</style>
</head>

  </div>

    <span id="dateDisplay"></span>
  </div>

  <div class="ticker-inner" id="ticker">

  </div>

  </div>

  </div>

<script>

const DATA_URL =
  "https://pv-house-sports.gian-ganziano.workers.dev/mlb";

const NEWS_URL =
  "https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/news?limit=10";

const FEATURED_TEAMS = [
  "Los Angeles Dodgers",
  "Los Angeles Angels"
];

const DEMO_LOCAL_LIVE =
  new URLSearchParams(window.location.search).get("demo") === "live";

const GAMES_PER_PAGE = 12;
const PAGE_DURATION = 12000;

let allGames = [];
let currentPage = 0;
let pageTimer = null;

function isFeaturedMlbGame(game){

  const teamNames = [
    game && game.awayTeam && game.awayTeam.name,
    game && game.homeTeam && game.homeTeam.name
  ];

  return Boolean(
    game &&
    (
      teamNames.some(name => FEATURED_TEAMS.includes(name))
    )
  );

}


/* ---------- DATE / TIME ---------- */

function formatHeaderDate(date){

  return date.toLocaleDateString(
    "en-US",
    {
      weekday:"short",
      month:"short",
      day:"numeric",
      year:"numeric",
      timeZone:"America/Los_Angeles"
    }
  ).toUpperCase();

}

function formatGameDate(iso){

  return new Date(iso)
    .toLocaleDateString(
      "en-US",
      {
        weekday:"short",
        month:"short",
        day:"numeric",
        timeZone:"America/Los_Angeles"
      }
    )
    .toUpperCase();

}

function formatTime(iso){

  return new Date(iso)
    .toLocaleTimeString(
      "en-US",
      {
        hour:"numeric",
        minute:"2-digit",
        timeZone:"America/Los_Angeles"
      }
    ) + " PT";

}


/* ---------- ODDS ---------- */

function getBookmaker(game){

  if(
    !game.bookmakers ||
    !game.bookmakers.length
  ){
    return null;
  }

  return(
    game.bookmakers.find(
      b => b.key === "draftkings"
    ) ||
    game.bookmakers[0]
  );

}

function getMarket(bookmaker,key){

  if(!bookmaker){
    return null;
  }

  return bookmaker.markets.find(
    m => m.key === key
  );

}

function findOutcome(market,team){

  if(!market){
    return null;
  }

  return market.outcomes.find(
    o => o.name === team
  );

}

function formatAmerican(value){

  if(
    value === undefined ||
    value === null
  ){
    return "—";
  }

  return value > 0
    ? "+" + value
    : String(value);

}


/* ---------- FEATURED ---------- */

function isFeatured(game){

  return game.isLocalTeam === true;

}


/* ---------- SCORES ---------- */

function getScore(game,team){

  if(
    !game.scores ||
    !Array.isArray(game.scores)
  ){
    return null;
  }

  const result =
    game.scores.find(
      score => score.name === team
    );

  if(!result){
    return null;
  }

  return result.score;

}


function gameStatus(game){

  if(game.completed){

    return {
      label:"FINAL",
      className:"final"
    };

  }

  if(
    game.scores &&
    Array.isArray(game.scores) &&
    game.scores.length
  ){

    return {
      label:"LIVE",
      className:"live"
    };

  }

  return {
    label:"UPCOMING",
    className:"upcoming"
  };

}


/* ---------- GAME ROW ---------- */

function createGameRow(game){

  const featured = isFeatured(game);
  const finalGame = game.status.label === "FINAL";
  const awayScore = game.awayScore !== null ? game.awayScore : "—";
  const homeScore = game.homeScore !== null ? game.homeScore : "—";
  const inning = game.status.label === "LIVE"
    ? [game.inningState, game.currentInningOrdinal].filter(Boolean).join(" ")
    : game.status.label === "FINAL" ? "FINAL" : "—";
  const gameInfo = game.status.label === "UPCOMING"
    ? [game.probablePitchers.away && game.probablePitchers.away.name,
       game.probablePitchers.home && game.probablePitchers.home.name]
        .filter(Boolean).join(" vs ") || game.status.detailed || "SCHEDULED"
    : game.status.detailed || game.status.label;

  return `
    <div class="game-row ${featured ? "featured" : ""}">
      <div class="two-lines">
        <div class="team-line away">
          ${game.awayTeam.name}
          ${featured ? '<span class="feature-tag">LA</span>' : ''}
        </div>
        <div class="team-line">${game.homeTeam.name}</div>
      </div>

      <div class="score-block">
        <div class="score-lines">
          <div class="score">${awayScore}</div>
          <div class="score">${homeScore}</div>
        </div>
      </div>

      <div class="odds"><div class="total ${finalGame ? "final" : ""}">${inning}</div></div>
      <div class="odds"><div class="total">${finalGame ? "" : formatTime(game.startTime)}</div></div>
      <div class="odds"><div class="total">${finalGame ? "" : (game.venue ? game.venue.name : "—")}</div></div>

      <div class="game-info">
        <div class="game-date">${formatGameDate(game.startTime)}</div>
        <div class="kickoff">${gameInfo}</div>
      </div>
    </div>
  `;

}

function renderLocalTeams(games){

  const local = games.filter(isFeaturedMlbGame);
  const localDiv = document.getElementById("localTeams");
  const gamesDiv = document.getElementById("games");

  if(!local.length){
    localDiv.className = "";
    localDiv.innerHTML = "";
    gamesDiv.classList.remove("with-local");
    return;
  }

  localDiv.className = "has-games";
  gamesDiv.classList.add("with-local");
  localDiv.innerHTML = `
    <div class="local-heading">LOCAL TEAMS TODAY</div>
    <div class="local-grid">
      ${local.map(game => {
        const state = game.status.label === "LIVE"
          ? [game.inningState, game.currentInningOrdinal].filter(Boolean).join(" ")
          : game.status.label === "FINAL" ? "FINAL" : formatTime(game.startTime);
        const matchup = `${game.awayTeam.shortName || game.awayTeam.name} ${game.awayScore ?? "—"}  —  ${game.homeTeam.shortName || game.homeTeam.name} ${game.homeScore ?? "—"}`;
        const pitchers = [game.probablePitchers.away && game.probablePitchers.away.name,
          game.probablePitchers.home && game.probablePitchers.home.name]
          .filter(Boolean).join(" vs ");
        const detail = game.status.label === "LIVE"
          ? `${state}${game.outs !== null ? ` · ${game.outs} OUT${game.outs === 1 ? "" : "S"}` : ""}`
          : pitchers || game.status.detailed || "SCHEDULED";
        const stats = game.status.label === "LIVE" || game.status.label === "FINAL"
          ? `${game.awayStats.runs ?? game.awayScore ?? "—"} R, ${game.awayStats.hits ?? "—"} H, ${game.awayStats.errors ?? "—"} E`
          : pitchers || "SCHEDULED";
        const middle = game.status.label === "LIVE"
          ? `<div>${game.inningState || ""} ${game.currentInningOrdinal || ""}</div><div>${game.outs ?? "—"} OUT${game.outs === 1 ? "" : "S"}</div>`
          : `<div>${formatTime(game.startTime)}</div><div>${game.status.detailed || "SCHEDULED"}</div>`;
        const right = game.status.label === "LIVE"
          ? `<div class="local-stats">${stats}</div><div>${game.liveSituation || ""}</div><div>COUNT ${game.count || "—"}</div>`
          : `<div class="local-stats">${stats}</div><div>${game.venue ? game.venue.name : "Venue TBD"}</div>`;
        return `
          <div class="local-card ${game.status.label === "LIVE" ? "local-live" : ""}">
            <div class="local-teams">
              <div class="local-team-line away">${game.awayTeam.shortName || game.awayTeam.name}<span class="local-team-score">${game.awayScore ?? "—"}</span></div>
              <div class="local-team-line">${game.homeTeam.shortName || game.homeTeam.name}<span class="local-team-score">${game.homeScore ?? "—"}</span></div>
            </div>
            <div class="local-middle">${middle}</div>
            <div class="local-right">${right}</div>
          </div>`;
      }).join("")}
    </div>`;
}


/* ---------- PAGES ---------- */

function displayPage(){

  if(!allGames.length){
    return;
  }

  const gamesDiv =
    document.getElementById(
      "games"
    );

  const gamesPerPage = document
    .getElementById("localTeams")
    .classList.contains("has-games") ? 8 : GAMES_PER_PAGE;

  const totalPages =
    Math.ceil(
      allGames.length /
      gamesPerPage
    );

  if(
    currentPage >= totalPages
  ){
    currentPage = 0;
  }

  const start =
    currentPage *
    gamesPerPage;

  const end =
    Math.min(
      start +
      gamesPerPage,
      allGames.length
    );

  const pageGames =
    allGames.slice(
      start,
      end
    );

  gamesDiv.innerHTML =
    pageGames
      .map(createGameRow)
      .join("");


  document
    .getElementById(
      "pageIndicator"
    )
    .textContent =

      `GAMES ${start + 1}–${end} OF ${allGames.length}` +
      ` • PAGE ${currentPage + 1} OF ${totalPages}`;


  currentPage++;

  if(
    currentPage >= totalPages
  ){
    currentPage = 0;
  }

}


/* ---------- MLB HEADLINES ---------- */

async function loadHeadlines(){

  const ticker =
    document.getElementById(
      "ticker"
    );

  try{

    const response =
      await fetch(
        NEWS_URL,
        {
          cache:"no-store"
        }
      );

    if(!response.ok){
      throw new Error(
        "MLB news unavailable"
      );
    }

    const data =
      await response.json();

    const headlines =
      (data.articles || [])
        .map(article =>
          article.headline ||
          article.title
        )
        .filter(Boolean)
        .slice(0, 8);

    ticker.textContent =
      headlines.length
        ? headlines.join(
            "          •          "
          )
        : "MLB HEADLINES — NO RECENT STORIES";

  }catch(error){

    ticker.textContent =
      "MLB HEADLINES — NEWS FEED UNAVAILABLE";

  }

}


function normalizeMlbGame(event,isToday){

  const competition = event.competitions && event.competitions[0];
  if(!competition) return null;

  const competitors = competition.competitors || [];
  const away = competitors.find(c => c.homeAway === "away") || competitors[1];
  const home = competitors.find(c => c.homeAway === "home") || competitors[0];
  if(!away || !home) return null;

  const type = (competition.status && competition.status.type) || {};
  const completed = type.completed === true || type.state === "post";
  if(!isToday && !completed) return null;

  const live =
    !completed &&
    (type.state === "in" || type.name === "STATUS_IN_PROGRESS");

  return {
    awayTeam: away.team.displayName || away.team.shortDisplayName || "Away",
    homeTeam: home.team.displayName || home.team.shortDisplayName || "Home",
    awayScore: away.score || "—",
    homeScore: home.score || "—",
    start: event.date,
    venue: competition.venue && competition.venue.fullName,
    inning: competition.status && competition.status.period
      ? "INNING " + competition.status.period
      : "",
    detail: type.shortDetail || type.detail ||
      (completed ? "FINAL" : "UPCOMING"),
    status:{
      label: completed ? "FINAL" : live ? "LIVE" : "UPCOMING",
      className: completed ? "final" : live ? "live" : "upcoming"
    },
    isToday
  };

}


/* ---------- LOAD ---------- */





function normalizeOddsGame(raw){

  const awayName = raw.away_team || (raw.awayTeam && raw.awayTeam.name) || "";
  const homeName = raw.home_team || (raw.homeTeam && raw.homeTeam.name) || "";
  const scores = raw.scores || [];
  const awayScore = raw.awayScore ?? raw.away_score ?? (scores.find(score => score.name === awayName) || {}).score ?? null;
  const homeScore = raw.homeScore ?? raw.home_score ?? (scores.find(score => score.name === homeName) || {}).score ?? null;
  const status = typeof raw.status === "string" ? {label:raw.status} : (raw.status || {});
  const statusLabel = String(status.label || status.name || status.state || "").toUpperCase();
  const completed = raw.completed === true || statusLabel === "FINAL" || statusLabel === "COMPLETED";
  const live = statusLabel === "LIVE" || statusLabel === "IN PROGRESS" || Boolean(scores.length && !completed);
  const venueValue = raw.venue ?? raw.venue_name ?? raw.venueName ?? null;
  const venue = typeof venueValue === "string"
    ? {name:venueValue}
    : venueValue && typeof venueValue === "object"
      ? { ...venueValue, name: venueValue.name || venueValue.fullName || venueValue.venue_name || "" }
      : null;
  const awayStats = raw.awayStats || raw.away_stats || {};
  const homeStats = raw.homeStats || raw.home_stats || {};
  const probablePitchers = raw.probablePitchers || raw.probable_pitchers || {away:null,home:null};

  return {
    ...raw,
    awayTeam:{...(raw.awayTeam || {}),name:awayName,shortName:(raw.awayTeam && raw.awayTeam.shortName) || raw.away_team_short_name || awayName},
    homeTeam:{...(raw.homeTeam || {}),name:homeName,shortName:(raw.homeTeam && raw.homeTeam.shortName) || raw.home_team_short_name || homeName},
    startTime:raw.startTime || raw.commence_time || "",
    awayScore,
    homeScore,
    status:{...status,label:completed ? "FINAL" : live ? "LIVE" : "UPCOMING",className:completed ? "final" : live ? "live" : "upcoming",detailed:status.detailed || (completed ? "Final" : live ? "In Progress" : "Scheduled")},
    currentInning:raw.currentInning ?? raw.current_inning ?? null,
    currentInningOrdinal:raw.currentInningOrdinal || raw.current_inning_ordinal || null,
    inningState:raw.inningState || raw.inning_state || null,
    outs:raw.outs ?? null,
    venue,
    probablePitchers,
    awayStats,
    homeStats,
    liveSituation:raw.liveSituation || raw.live_situation || raw.runners || null,
    count:raw.count || raw.batter_count || null,
    isLocalTeam:FEATURED_TEAMS.includes(awayName) || FEATURED_TEAMS.includes(homeName)
  };

}


async function loadGames(){

  const gamesDiv = document.getElementById("games");

  try{

    const response = await fetch(DATA_URL, {cache:"no-store"});
    if(!response.ok){
      throw new Error("MLB data unavailable");
    }

    const payload = await response.json();
    if(!Array.isArray(payload)){
      throw new Error("MLB data format unavailable");
    }

    let games = payload
      .filter(raw => raw && (raw.away_team || raw.awayTeam) && (raw.home_team || raw.homeTeam))
      .map(normalizeOddsGame)
      .sort((a,b) => new Date(a.startTime) - new Date(b.startTime));

    if(DEMO_LOCAL_LIVE){
      const demoIndex = games.findIndex(game =>
        game.localTeam && game.localTeam.shortName === "Dodgers"
      );
      const index = demoIndex >= 0 ? demoIndex : games.findIndex(isFeaturedMlbGame);

      if(index >= 0){
        games[index] = {
          ...games[index],
          awayScore: 2,
          homeScore: 4,
          status:{
            label:"LIVE",
            className:"live",
            abstract:"Live",
            detailed:"In Progress",
            code:"I"
          },
          currentInning:6,
          currentInningOrdinal:"6th",
          inningState:"Bottom",
          outs:1,
          awayStats:{runs:2,hits:5,errors:1},
          homeStats:{runs:4,hits:8,errors:0},
          liveSituation:"Runner on 2nd",
          count:"1–2",
          lastPlay:"Smith singled to center"
        };
      }
    }

    allGames = games.filter(game => !isFeaturedMlbGame(game));
    if(!allGames.length && games.length){
      allGames = games;
    }
    currentPage = 0;

    renderLocalTeams(games);

    if(!allGames.length){
      gamesDiv.innerHTML =
        '<div class="no-games">No MLB games available.</div>';
      return;
    }

    displayPage();

    if(pageTimer){
      clearInterval(pageTimer);
    }

    const visiblePageSize = document
      .getElementById("localTeams")
      .classList.contains("has-games") ? 8 : GAMES_PER_PAGE;

    if(allGames.length > visiblePageSize){
      pageTimer = setInterval(displayPage,PAGE_DURATION);
    }

    loadHeadlines();

    document.getElementById("updated").textContent =
      "UPDATED " +
      new Date().toLocaleTimeString(
        "en-US",
        {hour:"numeric",minute:"2-digit",timeZone:"America/Los_Angeles"}
      ) +
      " PT";

  }catch(error){

    gamesDiv.innerHTML =
      '<div class="error">Unable to load MLB scores.</div>';

  }

}

document

  )

    formatHeaderDate(

    );


loadHeadlines();

loadGames();


setInterval(
  loadGames,
  5 * 60 * 1000
);

setInterval(
  loadHeadlines,

);
